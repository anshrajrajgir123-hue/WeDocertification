  </defs>
  <!-- Card Background with Accent Top Border -->
  <rect x="5" y="4" width="110" height="92" rx="10" fill="url(#bg-gen_tec.svg)" stroke="#e2e8f0" stroke-width="1.5" filter="url(#badge-sh-gen_tec.svg)"/>
  <path d="M15 4 L105 4" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Vector Emblem -->
