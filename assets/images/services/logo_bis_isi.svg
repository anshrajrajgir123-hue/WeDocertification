<svg xmlns="http://www.w3.org/2000.jpeg" viewBox="0 0 144 118" width="144" height="118">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Hexagon Outer Border -->
  <polygon points="72,4 136,36 136,82 72,114 8,82 8,36" fill="#ffffff" stroke="#075B50" stroke-width="3" filter="url(#shadow)"/>
  <!-- Hexagon Inner Border -->
  <polygon points="72,9 130,38 130,80 72,109 14,80 14,38" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <!-- Inner Logo Content -->
