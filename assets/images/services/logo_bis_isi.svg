  <text x="72" y="64" font-family="'Archivo Narrow', Impact, sans-serif" font-size="18" font-weight="bold" fill="#075B50" text-anchor="middle">ISI</text>
  <text x="72" y="76" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#153E82" text-anchor="middle">IS:STANDARD</text>
